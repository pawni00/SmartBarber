<!DOCTYPE html>
<html>
<head>
    <title>SmartBarber - Appointment</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1> SmartBarber</h1>

    <nav>
        <a href="index.html">Home</a> |
        <a href="services.html">Services</a> |
        <a href="appointment.html">Appointment</a>
    </nav>

    <h2>📅 Book Your Appointment</h2>

    <p>Avoid waiting at the barber shop. Book your time in advance!</p>

    <form>

        <input type="text" id="name" placeholder="Enter your name" required>
        <br>

        <input type="tel" id="phone" placeholder="Enter phone number" required>
        <br>

        <select id="service" required>
            <option value="">Select Service</option>
            <option>Haircut - ₹150</option>
            <option>Beard Styling - ₹100</option>
            <option>Haircut + Beard - ₹250</option>
            <option>Hair Spa - ₹300</option>
            <option>Hair Styling - ₹200</option>
            <option>Clean Shave - ₹120</option>
        </select>
        <br>

        <input type="date" id="date" required>
        <br>

        <input type="time" id="time" required>
        <br><br>

        <button type="button" onclick="bookAppointment()">
            Book Appointment
        </button>

    </form>

    <script src="script.js"></script>

</body>
</html>
